<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner Dashboard — Aphelion Expeditions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="stylesheet" href="styles.css">
<style>
  .dash-wrap { max-width: 900px; margin: 0 auto; padding: 60px 20px 100px; }
  .status-pill { display:inline-block; padding:5px 14px; border-radius:20px; font-size:11px; text-transform:uppercase; letter-spacing:.5px; font-weight:600; }
  .status-pill.pending { background:rgba(212,175,55,.15); color:var(--gold-soft); border:1px solid rgba(212,175,55,.4); }
  .status-pill.approved { background:rgba(64,180,120,.15); color:#7ee0a8; border:1px solid rgba(64,180,120,.4); }
  .status-pill.rejected { background:rgba(224,86,86,.15); color:#f19a9a; border:1px solid rgba(224,86,86,.4); }
  .info-grid { display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:24px; }
  .info-item { background: var(--panel); border:1px solid var(--border); border-radius: var(--radius); padding:20px; }
  .info-item .label { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:6px; }
  .info-item .value { font-size:16px; color:var(--white); }
  #loadingMsg { color: var(--muted); }
  .section-divider { border:none; border-top:1px solid var(--border); margin:50px 0 30px; }
  .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  .tour-admin-list { display:flex; flex-direction:column; gap:14px; margin-bottom:30px; }
  .tour-admin-row { background: var(--panel); border:1px solid var(--border); border-radius: var(--radius); padding:16px 20px; display:flex; align-items:center; gap:16px; }
  .tour-admin-row img { width:70px; height:50px; object-fit:cover; border-radius:6px; flex-shrink:0; background:#111; }
  .tour-admin-row .info { flex:1; min-width:0; }
  .tour-admin-row .info h4 { font-size:16px; margin:0 0 4px; color:var(--white); }
  .tour-admin-row .info span { font-size:12px; color:var(--muted); }
  .tour-admin-row .actions { display:flex; gap:8px; flex-shrink:0; }
  .tour-admin-row .actions button { border:1px solid var(--border); background:transparent; color:var(--muted); padding:8px 14px; border-radius:6px; font-size:12px; cursor:pointer; text-transform:uppercase; letter-spacing:.4px; }
  .tour-admin-row .actions button:hover { border-color: var(--gold-soft); color: var(--gold-soft); }
  .tour-admin-row .actions button.danger:hover { border-color:#e05656; color:#e05656; }
  .status-msg { padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:20px; display:none; }
  .status-msg.ok { background:rgba(64,180,120,.12); border:1px solid rgba(64,180,120,.4); color:#7ee0a8; display:block; }
  .status-msg.err { background:rgba(224,86,86,.12); border:1px solid rgba(224,86,86,.4); color:#f19a9a; display:block; }
  .photo-preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .photo-thumb { position: relative; width: 80px; height: 60px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-thumb button { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.75); color: #fff; font-size: 14px; line-height: 1; border: none; cursor: pointer; }

  @media (max-width: 640px) {
    .info-grid { grid-template-columns: 1fr; }
    .tour-admin-row { flex-wrap: wrap; }
    .tour-admin-row .actions { width: 100%; flex-wrap: wrap; }
    .tour-admin-row .actions button { flex: 1 1 auto; }
    .section-header { align-items: stretch; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="container topbar-content">
    <span>For travel partners &amp; tour operators worldwide</span>
    <span>partners@aphelionexpeditions.com</span>
  </div>
</div>

<header>
  <div class="container navbar">
    <a href="index.html" class="logo"><img src="logo-full-transparent.png" alt="Aphelion Expeditions" class="logo-full-img"></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="tours.html">Tours</a>
    </nav>
    <div class="nav-actions">
      <button class="btn btn-outline" id="logoutBtn">Log Out</button>
    </div>
  </div>
</header>

<div class="dash-wrap">
  <p id="loadingMsg">Loading your dashboard…</p>

  <div id="dashContent" style="display:none;">
    <h1 style="font-size:32px; margin-bottom:6px;">Welcome, <span id="companyNameOut"></span></h1>
    <p style="color:var(--muted);">This is your partner dashboard.</p>

    <div class="info-grid">
      <div class="info-item">
        <div class="label">Status</div>
        <div class="value"><span id="statusOut" class="status-pill"></span></div>
      </div>
      <div class="info-item">
        <div class="label">Contact Person</div>
        <div class="value" id="contactOut"></div>
      </div>
      <div class="info-item">
        <div class="label">Email</div>
        <div class="value" id="emailOut"></div>
      </div>
      <div class="info-item">
        <div class="label">Country</div>
        <div class="value" id="countryOut"></div>
      </div>
    </div>

    <hr class="section-divider">

    <div class="section-header">
      <h2 style="font-size:26px;">My Tours</h2>
      <button class="btn btn-primary" onclick="openTourForm()">+ Add New Tour</button>
    </div>

    <div id="tourStatusMsg" class="status-msg"></div>

    <div id="myToursList" class="tour-admin-list">
      <p style="color:var(--muted);">Loading your tours…</p>
    </div>

    <div class="form-card" id="tourFormCard" style="display:none;">
      <h3 id="tourFormTitle">Add Tour</h3>
      <form id="myTourForm">
        <input type="hidden" id="t_id">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="t_title" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Location</label>
            <input type="text" id="t_location" required>
          </div>
          <div class="form-group">
            <label>Destination key (e.g. lisbon, japan)</label>
            <input type="text" id="t_destination" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Category (food / culture / cruise / nature)</label>
            <input type="text" id="t_category" required>
          </div>
          <div class="form-group">
            <label>Tag (e.g. Popular, Best Seller)</label>
            <input type="text" id="t_tag">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Duration (e.g. 3 hours)</label>
            <input type="text" id="t_duration">
          </div>
          <div class="form-group">
            <label>Group size (e.g. Up to 10 travelers)</label>
            <input type="text" id="t_group">
          </div>
        </div>
        <div class="form-group">
          <label>Price per person (JPY ¥, number only)</label>
          <input type="number" step="1" min="0" id="t_price" required>
        </div>
        <div class="form-group">
          <label>Photos (select one or more — first one becomes the cover photo)</label>
          <input type="file" id="t_photos" accept="image/*" multiple>
          <div id="t_photos_preview" class="photo-preview-grid"></div>
        </div>
        <div class="form-group">
          <label>Or paste an Image URL instead (optional, used only if no photos uploaded above)</label>
          <input type="text" id="t_image">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="t_description" rows="5"></textarea>
        </div>
        <div style="display:flex; gap:12px;">
          <button type="submit" class="btn btn-primary">Save Tour</button>
          <button type="button" class="btn btn-outline" onclick="closeTourForm()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<footer>
  <div class="container">
    <div class="copyright">© 2026 Aphelion Expeditions. All rights reserved.</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  let currentUserId = null;

  // --- Auto logout after 5 minutes of inactivity ---
  // Closing the tab or refreshing no longer keeps you logged in forever;
  // if there's no click/keypress/scroll for 5 minutes, you're signed out
  // and sent back to the login page automatically.
  const IDLE_LIMIT_MS = 5 * 60 * 1000; // 5 minutes
  const LAST_ACTIVITY_KEY = 'aex_last_activity';

  function markActivity() {
    localStorage.setItem(LAST_ACTIVITY_KEY, Date.now().toString());
  }

  async function checkIdleAndLogout() {
    const last = parseInt(localStorage.getItem(LAST_ACTIVITY_KEY) || '0', 10);
    if (Date.now() - last > IDLE_LIMIT_MS) {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }
  }

  ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'].forEach(evt => {
    document.addEventListener(evt, markActivity, { passive: true });
  });
  markActivity();
  setInterval(checkIdleAndLogout, 15000); // check every 15s

  (async () => {
    // if the tab was closed/idle past the limit before this page even loaded,
    // log out immediately instead of showing the dashboard first
    await checkIdleAndLogout();

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }
    currentUserId = session.user.id;
    markActivity();

    const { data: profile, error } = await supabaseClient
      .from('partners')
      .select('*')
      .eq('id', session.user.id)
      .single();

    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('dashContent').style.display = 'block';

    if (error || !profile) {
      document.getElementById('companyNameOut').textContent = session.user.email;
      document.getElementById('statusOut').textContent = 'No profile found';
      return;
    }

    document.getElementById('companyNameOut').textContent = profile.company_name;
    document.getElementById('contactOut').textContent = profile.contact_person || '—';
    document.getElementById('emailOut').textContent = profile.email;
    document.getElementById('countryOut').textContent = profile.country || '—';

    const statusEl = document.getElementById('statusOut');
    statusEl.textContent = profile.status;
    statusEl.classList.add(profile.status);

    loadMyTours();
  })();

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html'; // manual log out → public home page
  });

  function showTourStatus(msg, ok) {
    const el = document.getElementById('tourStatusMsg');
    el.textContent = msg;
    el.className = 'status-msg ' + (ok ? 'ok' : 'err');
    setTimeout(() => { el.className = 'status-msg'; }, 4000);
  }

  async function loadMyTours() {
    const list = document.getElementById('myToursList');
    const { data: tours, error } = await supabaseClient
      .from('tours')
      .select('*')
      .eq('partner_id', currentUserId)
      .order('id', { ascending: false });

    if (error) {
      list.innerHTML = '<p style="color:#f19a9a;">Could not load your tours: ' + error.message + '</p>';
      return;
    }
    if (!tours.length) {
      list.innerHTML = '<p style="color:var(--muted);">You have no tours yet. Add your first one above.</p>';
      return;
    }
    list.innerHTML = tours.map(t => `
      <div class="tour-admin-row">
        <img src="${t.image || ''}" onerror="this.style.opacity=0.2">
        <div class="info">
          <h4>${t.title} <span class="status-pill ${t.status || 'pending'}">${t.status || 'pending'}</span></h4>
          <span>${t.location} · ¥${Number(t.price).toLocaleString('ja-JP')} · ${t.category}</span>
        </div>
        <div class="actions">
          <button onclick='editMyTour(${JSON.stringify(t).replace(/'/g, "&apos;")})'>Edit</button>
          <button class="danger" onclick="deleteMyTour(${t.id}, '${(t.title || '').replace(/'/g, "\\'")}')">Delete</button>
        </div>
      </div>
    `).join('');
  }

  let editingTourImages = [];

  function renderTourPhotoPreview() {
    const el = document.getElementById('t_photos_preview');
    el.innerHTML = editingTourImages.map((url, i) => `
      <div class="photo-thumb">
        <img src="${url}" onerror="this.style.opacity=0.2">
        <button type="button" onclick="removeEditingTourImage(${i})">&times;</button>
      </div>
    `).join('');
  }

  function removeEditingTourImage(i) {
    editingTourImages.splice(i, 1);
    renderTourPhotoPreview();
  }

  // Shrinks/compresses a photo before upload so a large phone photo doesn't
  // eat the free storage quota or slow the site down. Every photo ends up
  // at most 1600px wide, saved as a JPEG — this also makes gallery photos
  // a consistent size regardless of what device they were taken on.
  function resizeImage(file, maxWidth = 1600, quality = 0.82) {
    return new Promise((resolve) => {
      if (!file.type || !file.type.startsWith('image/') || file.type === 'image/gif') {
        resolve(file); // leave GIFs and non-images untouched
        return;
      }
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        let { width, height } = img;
        if (width > maxWidth) {
          height = Math.round(height * (maxWidth / width));
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => resolve(blob || file), 'image/jpeg', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  async function uploadTourImage(file) {
    const resized = await resizeImage(file);
    const ext = resized.type === 'image/jpeg' ? 'jpg' : (file.name.split('.').pop() || 'jpg');
    const path = `${currentUserId}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
    const { error } = await supabaseClient.storage.from('tour-images').upload(path, resized, {
      contentType: resized.type || 'application/octet-stream'
    });
    if (error) throw error;
    const { data } = supabaseClient.storage.from('tour-images').getPublicUrl(path);
    return data.publicUrl;
  }

  document.getElementById('t_photos').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    showTourStatus('Uploading photo(s)…', true);
    try {
      for (const file of files) {
        const url = await uploadTourImage(file);
        editingTourImages.push(url);
      }
      renderTourPhotoPreview();
      showTourStatus('Photo(s) uploaded.', true);
    } catch (err) {
      showTourStatus('Could not upload: ' + err.message, false);
    }
    e.target.value = '';
  });

  function openTourForm() {
    document.getElementById('tourFormTitle').textContent = 'Add Tour';
    document.getElementById('myTourForm').reset();
    document.getElementById('t_id').value = '';
    editingTourImages = [];
    renderTourPhotoPreview();
    document.getElementById('tourFormCard').style.display = 'block';
    document.getElementById('tourFormCard').scrollIntoView({ behavior: 'smooth' });
  }

  function closeTourForm() {
    document.getElementById('tourFormCard').style.display = 'none';
  }

  function editMyTour(t) {
    document.getElementById('tourFormTitle').textContent = 'Edit Tour';
    document.getElementById('t_id').value = t.id;
    document.getElementById('t_title').value = t.title || '';
    document.getElementById('t_location').value = t.location || '';
    document.getElementById('t_destination').value = t.destination || '';
    document.getElementById('t_category').value = t.category || '';
    document.getElementById('t_tag').value = t.tag || '';
    document.getElementById('t_duration').value = t.duration || '';
    document.getElementById('t_group').value = t.group_size || '';
    document.getElementById('t_price').value = t.price || '';
    document.getElementById('t_image').value = t.image || '';
    document.getElementById('t_description').value = t.description || '';
    editingTourImages = Array.isArray(t.images) && t.images.length ? [...t.images] : (t.image ? [t.image] : []);
    renderTourPhotoPreview();
    document.getElementById('tourFormCard').style.display = 'block';
    document.getElementById('tourFormCard').scrollIntoView({ behavior: 'smooth' });
  }

  async function deleteMyTour(id, title) {
    const t = window.AEX_t || (x => x);
    if (!confirm(t('Delete this tour?') + '\n\n"' + title + '"\n\n' + t('This cannot be undone.'))) return;
    const { error } = await supabaseClient.from('tours').delete().eq('id', id).eq('partner_id', currentUserId);
    if (error) {
      showTourStatus('Could not delete: ' + error.message, false);
      return;
    }
    showTourStatus('Tour deleted.', true);
    loadMyTours();
  }

  document.getElementById('myTourForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('t_id').value;
    const payload = {
      title: document.getElementById('t_title').value,
      location: document.getElementById('t_location').value,
      destination: document.getElementById('t_destination').value,
      category: document.getElementById('t_category').value,
      tag: document.getElementById('t_tag').value,
      duration: document.getElementById('t_duration').value,
      group_size: document.getElementById('t_group').value,
      price: parseFloat(document.getElementById('t_price').value),
      image: editingTourImages[0] || document.getElementById('t_image').value || '',
      images: editingTourImages.length ? editingTourImages : (document.getElementById('t_image').value ? [document.getElementById('t_image').value] : []),
      description: document.getElementById('t_description').value,
      partner_id: currentUserId,
      status: 'pending' // every new or edited tour goes back to admin review before it appears on the site
    };

    let error;
    if (id) {
      ({ error } = await supabaseClient.from('tours').update(payload).eq('id', id).eq('partner_id', currentUserId));
    } else {
      ({ error } = await supabaseClient.from('tours').insert(payload));
    }

    if (error) {
      showTourStatus('Could not save: ' + error.message, false);
      return;
    }
    showTourStatus(id ? 'Tour updated — sent for review again.' : 'Tour added — pending review before it goes live.', true);
    closeTourForm();
    loadMyTours();
  });
</script>
<script src="i18n.js"></script>
</body>
</html>
